<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniRappi - Tienda</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1><i class="ri-store-2-line"></i> Mi Tienda</h1>
          <p>Gestiona tu menú y pedidos</p>
        </div>
        <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
      </header>

      <!-- Login Section -->
      <div id="loginSection" class="login-section">
        <div class="login-card">
          <div class="login-header">
            <h2>Acceso Tienda</h2>
            <p>Inicia sesión o regístrate para gestionar tu tienda</p>
            <i style="font-size: small">O regresa al <a href="/">menú</a></i>
          </div>

          <!-- Login Tabs -->
          <div class="login-tabs">
            <button id="loginTab" class="tab-btn active">Iniciar Sesión</button>
            <button id="registerTab" class="tab-btn">Registrarse</button>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="login-form active">
            <div class="form-group">
              <label for="loginUsername">Usuario</label>
              <input type="text" id="loginUsername" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">Contraseña</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="button" id="loginBtn" class="btn-login">
              Iniciar Sesión
            </button>
          </form>

          <!-- Register Form -->
          <form id="registerForm" class="login-form">
            <div class="form-group">
              <label for="registerUsername">Usuario</label>
              <input type="text" id="registerUsername" required />
            </div>
            <div class="form-group">
              <label for="registerPassword">Contraseña</label>
              <input type="password" id="registerPassword" required />
            </div>
            <div class="form-group">
              <label for="registerStoreName">Nombre de la Tienda</label>
              <input type="text" id="registerStoreName" required />
            </div>
            <div class="form-group">
              <label for="registerCategory">Categoría</label>
              <select id="registerCategory" required>
                <option value="">Selecciona una categoría</option>
                <option value="hamburguesas">🍔 Hamburguesas</option>
                <option value="pizza">🍕 Pizza</option>
                <option value="sushi">🍣 Sushi</option>
                <option value="comida-mexicana">🌮 Comida Mexicana</option>
                <option value="comida-china">🥡 Comida China</option>
                <option value="comida-italiana">🍝 Comida Italiana</option>
                <option value="postres">🍰 Postres</option>
                <option value="bebidas">🥤 Bebidas</option>
                <option value="combos">🍽️ Combos</option>
              </select>
            </div>
            <div class="form-group">
              <label for="registerDescription">Descripción</label>
              <textarea
                id="registerDescription"
                rows="3"
                placeholder="Describe tu tienda..."
              ></textarea>
            </div>
            <div class="form-group">
              <label for="registerAddress">Dirección</label>
              <input
                type="text"
                id="registerAddress"
                placeholder="Calle 123 #45-67"
                required
              />
            </div>
            <div class="form-group">
              <label for="registerPhone">Teléfono</label>
              <input
                type="tel"
                id="registerPhone"
                placeholder="3001234567"
                required
              />
            </div>
            <button type="button" id="registerBtn" class="btn-login">
              Registrarse
            </button>
          </form>
        </div>
      </div>

      <!-- Main Section -->
      <div id="mainSection" class="main-section">
        <!-- User Info Bar -->
        <div class="user-info-bar">
          <div class="user-welcome">
            <h3>¡Hola, <span id="storeName">Tienda</span>!</h3>
            <p>Gestiona tu menú y revisa tus pedidos</p>
          </div>
          <div class="store-status-control">
            <label class="store-status-toggle">
              <input type="checkbox" id="storeStatusToggle" />
              <span class="toggle-slider"></span>
              <span class="toggle-label">Tienda Abierta</span>
            </label>
          </div>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
          <!-- Stats Cards -->
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon"><i class="ri-restaurant-line"></i></div>
              <div class="stat-content">
                <h3 id="totalProducts">0</h3>
                <p>Productos</p>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon"><i class="ri-shopping-bag-line"></i></div>
              <div class="stat-content">
                <h3 id="totalOrders">0</h3>
                <p>Pedidos</p>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">
                <i class="ri-money-dollar-circle-line"></i>
              </div>
              <div class="stat-content">
                <h3 id="totalRevenue">$0</h3>
                <p>Ingresos</p>
              </div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="content-tabs">
            <button id="productsTab" class="content-tab active">
              Productos
            </button>
            <button id="ordersTab" class="content-tab">Pedidos</button>
          </div>

          <!-- Products Section -->
          <div id="productsSection" class="content-section active">
            <div class="section-header">
              <h2>Gestionar Productos</h2>
              <button id="addProductBtn" class="btn-primary">
                <i class="ri-add-line"></i> Agregar Producto
              </button>
            </div>

            <!-- Add Product Form -->
            <div
              id="addProductForm"
              class="add-product-form"
              style="display: none"
            >
              <h3>Nuevo Producto</h3>
              <form id="productForm">
                <div class="form-row">
                  <div class="form-group">
                    <label for="productName">Nombre del Producto</label>
                    <input type="text" id="productName" required />
                  </div>
                  <div class="form-group">
                    <label for="productPrice">Precio ($)</label>
                    <input
                      type="number"
                      id="productPrice"
                      min="0"
                      step="0.01"
                      required
                    />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="productCategory">Categoría</label>
                    <select id="productCategory" required>
                      <option value="">Selecciona una categoría</option>
                      <option value="hamburguesas">🍔 Hamburguesas</option>
                      <option value="pizza">🍕 Pizza</option>
                      <option value="sushi">🍣 Sushi</option>
                      <option value="comida-mexicana">
                        🌮 Comida Mexicana
                      </option>
                      <option value="comida-china">🥡 Comida China</option>
                      <option value="comida-italiana">
                        🍝 Comida Italiana
                      </option>
                      <option value="postres">🍰 Postres</option>
                      <option value="bebidas">🥤 Bebidas</option>
                      <option value="combos">🍽️ Combos</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label for="productImage">URL de la Imagen</label>
                    <input
                      type="url"
                      id="productImage"
                      placeholder="https://ejemplo.com/imagen.jpg"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label for="productDescription">Descripción</label>
                  <textarea
                    id="productDescription"
                    rows="3"
                    placeholder="Describe tu producto..."
                  ></textarea>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary">
                    Crear Producto
                  </button>
                  <button
                    type="button"
                    id="cancelProductBtn"
                    class="btn-secondary"
                  >
                    Cancelar
                  </button>
                </div>
              </form>
            </div>

            <!-- Products Grid -->
            <div id="productsGrid" class="products-grid">
              <!-- Los productos se cargarán dinámicamente aquí -->
            </div>
          </div>

          <!-- Orders Section -->
          <div id="ordersSection" class="content-section">
            <div class="section-header">
              <h2>Pedidos Recibidos</h2>
              <button id="refreshOrdersBtn" class="btn-secondary">
                <i class="ri-refresh-line"></i> Actualizar
              </button>
            </div>

            <!-- Orders Grid -->
            <div id="ordersGrid" class="orders-grid">
              <!-- Los pedidos se cargarán dinámicamente aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
