<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arduino Control Panel - Neumorphic UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1 class="title">Arduino Control Panel</h1>
        <p class="subtitle">Sistema de Control Neumórfico</p>
      </div>

      <div class="grid">
        <!-- LEDs Individuales -->
        <div class="card">
          <h2 class="card-title">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 18h6M10 22h4M15 2a6 6 0 0 0-6 6v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8a6 6 0 0 0-6-6z"
              />
            </svg>
            LEDs Individuales
          </h2>

          <div class="led-controls">
            <div class="led-row">
              <span class="led-label">LED Rojo</span>
              <button class="led-button" id="ledRed" data-color="red"></button>
            </div>
            <div class="led-row">
              <span class="led-label">LED Verde</span>
              <button
                class="led-button"
                id="ledGreen"
                data-color="green"
              ></button>
            </div>
            <div class="led-row">
              <span class="led-label">LED Amarillo</span>
              <button
                class="led-button"
                id="ledYellow"
                data-color="yellow"
              ></button>
            </div>
          </div>
        </div>

        <!-- LED RGB -->
        <div class="card">
          <h2 class="card-title">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            LED RGB
          </h2>

          <div class="rgb-controls">
            <div class="rgb-preview" id="rgbPreview"></div>

            <div class="slider-group">
              <label class="slider-label"
                >Rojo: <span id="redValue">255</span></label
              >
              <input
                type="range"
                min="0"
                max="255"
                value="255"
                class="slider"
                id="redSlider"
              />
            </div>

            <div class="slider-group">
              <label class="slider-label"
                >Verde: <span id="greenValue">0</span></label
              >
              <input
                type="range"
                min="0"
                max="255"
                value="0"
                class="slider"
                id="greenSlider"
              />
            </div>

            <div class="slider-group">
              <label class="slider-label"
                >Azul: <span id="blueValue">0</span></label
              >
              <input
                type="range"
                min="0"
                max="255"
                value="0"
                class="slider"
                id="blueSlider"
              />
            </div>
          </div>
        </div>

        <!-- Potenciómetro -->
        <div class="card">
          <h2 class="card-title">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
              <line x1="12" y1="2" x2="12" y2="12" />
            </svg>
            Potenciómetro
          </h2>

          <div class="pot-controls">
            <div class="pot-display">
              <div class="pot-needle" id="potNeedle"></div>
              <div class="pot-value" id="potValue">50%</div>
            </div>
            <input
              type="range"
              min="0"
              max="100"
              value="50"
              class="slider"
              id="potSlider"
            />
          </div>
        </div>

        <!-- Matriz 8x8 -->
        <div class="card matrix-card">
          <div class="matrix-header">
            <h2 class="card-title">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
              Matriz LED 8x8
            </h2>
            <button class="clear-button" id="clearMatrix">Limpiar</button>
          </div>

          <div class="matrix-container">
            <div class="matrix-grid" id="matrixGrid"></div>
          </div>
        </div>

        <!-- Fotocelda -->
        <div class="card">
          <h2 class="card-title">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            Fotocelda
          </h2>

          <div class="photo-controls">
            <div class="photo-display">
              <div class="photo-overlay" id="photoOverlay"></div>
              <svg
                class="photo-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
            </div>
            <div class="photo-value-display">
              <div class="photo-value" id="photoValue">512</div>
              <div class="photo-label">Valor ADC (0-1023)</div>
            </div>
            <input
              type="range"
              min="0"
              max="1023"
              value="512"
              class="slider"
              id="photoSlider"
            />
          </div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
