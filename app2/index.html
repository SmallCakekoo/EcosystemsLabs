<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniRappi - Repartidor</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1>🚚 MiniRappi</h1>
          <p>Gestionar Pedidos</p>
        </div>
        <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
      </header>

      <!-- Login Section -->
      <div id="loginSection" class="login-section">
        <div class="login-card">
          <div class="login-header">
            <h2>Acceso Repartidor</h2>
            <p>Inicia sesión o regístrate para comenzar</p>
            <i style="font-size: small">O regresa al <a href="/">menú</a></i>
          </div>

          <!-- Login Tabs -->
          <div class="login-tabs">
            <button id="loginTab" class="tab-btn active">Iniciar Sesión</button>
            <button id="registerTab" class="tab-btn">Registrarse</button>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="login-form active">
            <div class="form-group">
              <label for="loginUsername">Usuario</label>
              <input type="text" id="loginUsername" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">Contraseña</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="button" id="loginBtn" class="btn-login">
              Iniciar Sesión
            </button>
          </form>

          <!-- Register Form -->
          <form id="registerForm" class="login-form">
            <div class="form-group">
              <label for="registerUsername">Usuario</label>
              <input type="text" id="registerUsername" required />
            </div>
            <div class="form-group">
              <label for="registerPassword">Contraseña</label>
              <input type="password" id="registerPassword" required />
            </div>
            <div class="form-group">
              <label for="registerName">Nombre Completo</label>
              <input type="text" id="registerName" required />
            </div>
            <div class="form-group">
              <label for="registerPhone">Teléfono</label>
              <input type="tel" id="registerPhone" required />
            </div>
            <button type="button" id="registerBtn" class="btn-login">
              Registrarse
            </button>
          </form>
        </div>
      </div>

      <!-- Main Section -->
      <div id="mainSection" class="main-section">
        <!-- User Info Bar -->
        <div class="user-info-bar">
          <div class="user-welcome">
            <h3>¡Hola, <span id="userName">Repartidor</span>!</h3>
            <p>Gestiona tus pedidos pendientes</p>
          </div>
        </div>

        <!-- Orders Section -->
        <div class="orders-section">
          <h2>Pedidos Disponibles</h2>

          <!-- Filter Tabs -->
          <div class="filter-tabs">
            <button id="pendingTab" class="filter-btn active">
              Pendientes
            </button>
            <button id="acceptedTab" class="filter-btn">Aceptados</button>
          </div>

          <!-- Orders Grid -->
          <div id="ordersGrid" class="orders-grid">
            <!-- Los pedidos se cargarán dinámicamente aquí -->
          </div>

          <!-- Loading -->
          <div id="loading" class="loading" style="display: none">
            <div class="spinner"></div>
            <p>Cargando pedidos...</p>
          </div>

          <!-- No Orders Message -->
          <div id="noOrders" class="no-orders" style="display: none">
            <div class="no-orders-icon">📦</div>
            <h3>No hay pedidos disponibles</h3>
            <p>Los pedidos aparecerán aquí cuando estén listos para entrega</p>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
