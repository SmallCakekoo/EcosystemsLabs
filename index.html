<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecosystems Labs - Selecciona tu App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7ff 0%, #ffd9fc 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 800px;
        width: 100%;
      }

      .title {
        color: #333;
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }

      .subtitle {
        color: #333;
        font-size: 1.2rem;
        margin-bottom: 3rem;
      }

      .apps-container {
        display: flex;
        gap: 2rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .app-card {
        flex: 1;
        min-width: 300px;
        max-width: 350px;
        height: 200px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
      }

      .app-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        transition: transform 0.6s ease;
      }

      .app-card:hover::before {
        transform: translateX(100%);
      }

      .app1 {
        background: linear-gradient(135deg, #ff6b9d, #ff8fab, #ffa8c5);
      }

      .app1:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 15px 30px rgba(255, 107, 157, 0.4);
      }

      .app2 {
        background: linear-gradient(135deg, #a855f7, #c084fc, #d8b4fe);
      }

      .app2:hover {
        transform: translateY(-10px) scale(1.05);
        box-shadow: 0 15px 30px rgba(168, 85, 247, 0.4);
      }

      .app-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      .app-title {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      .app-subtitle {
        font-size: 1rem;
        opacity: 0.9;
        font-weight: normal;
      }

      .footer {
        margin-top: 3rem;
        color: #333;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .apps-container {
          flex-direction: column;
          align-items: center;
        }

        .app-card {
          min-width: 280px;
          max-width: 320px;
        }

        .title {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Ecosystems Labs</h1>
      <p class="subtitle">Selecciona la aplicación que deseas usar</p>

      <div class="apps-container">
        <a href="/app1/index.html" class="app-card app1">
          <div class="app-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="60"
              height="60"
              viewBox="0 0 24 24"
            >
              <path
                fill="#ffffff"
                fill-rule="evenodd"

                clip-rule="evenodd"
              />
            </svg>
          </div>
          <div class="app-title">App1</div>
          <div class="app-subtitle">Pantalla Rosa</div>
        </a>

        <a href="/app2/index.html" class="app-card app2">
          <div class="app-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="60"
              height="60"
              viewBox="0 0 24 24"
            >
              <path
                fill="#ffffff"
                d="M18 4c-1.71 0-2.75.33-3.35.61C13.88 4.23 13 4 12 4s-1.88.23-2.65.61C8.75 4.33 7.71 4 6 4c-3 0-5 8-5 10c0 .83 1.32 1.59 3.14 1.9c.64 2.24 3.66 3.95 7.36 4.1v-4.28c-.59-.37-1.5-1.04-1.5-1.72c0-1 2-1 2-1s2 0 2 1c0 .68-.91 1.35-1.5 1.72V20c3.7-.15 6.72-1.86 7.36-4.1C21.68 15.59 23 14.83 23 14c0-2-2-10-5-10M4.15 13.87c-.5-.12-.89-.26-1.15-.37c.25-2.77 2.2-7.1 3.05-7.5c.54 0 .95.06 1.32.11c-2.1 2.31-2.93 5.93-3.22 7.76M9 12a1 1 0 0 1-1-1c0-.54.45-1 1-1a1 1 0 0 1 1 1c0 .56-.45 1-1 1m6 0a1 1 0 0 1-1-1c0-.54.45-1 1-1a1 1 0 0 1 1 1c0 .56-.45 1-1 1m4.85 1.87c-.29-1.83-1.12-5.45-3.22-7.76c.37-.05.78-.11 1.32-.11c.85.4 2.8 4.73 3.05 7.5c-.25.11-.64.25-1.15.37"
              />
            </svg>
          </div>
          <div class="app-title">App2</div>
          <div class="app-subtitle">Pantalla Morada</div>
        </a>
      </div>

      <div class="footer">
        <p>
          Laboratorio de Bases de Datos - Endpoints REST disponibles en ambas
          apps, son iguales xd.
        </p>
      </div>
    </div>
  </body>
</html>
